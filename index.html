<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Surf Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#speed{position:fixed;left:16px;bottom:12px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000a;pointer-events:none}
#speed small{font-size:13px;opacity:.7;font-weight:500}
#timer{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000a;pointer-events:none}
#best,#prog{position:fixed;left:12px;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 4px #000a}
#best{top:12px}#prog{top:30px}
.btn{position:fixed;top:8px;width:40px;height:40px;border-radius:20px;border:0;background:#ffffff22;color:#fff;font-size:20px;backdrop-filter:blur(6px)}
#restart{right:8px}#gear{right:56px}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:17px;line-height:1.4;background:#000a;padding:14px 18px;border-radius:12px;max-width:80vw;pointer-events:none}
#msg b{font-size:22px}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);font-size:15px;font-weight:600;color:#ffe066;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 4px #000a}
#settings{position:fixed;right:8px;top:56px;background:#000c;padding:12px;border-radius:12px;font-size:14px;width:220px}
#settings label{display:block;margin:6px 0 4px}
#settings .row{display:flex;gap:6px}
#settings .row button{flex:1;padding:8px 0;border:0;border-radius:8px;background:#ffffff22;color:#fff;font-size:13px}
#settings .row button.on{background:#3fc1c9;color:#000}
#settings input{width:100%}
#flow{position:fixed;left:50%;top:38px;transform:translateX(-50%);width:210px;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 1px 4px #000a}
#flow.on{opacity:1}
#flowbar{height:6px;border-radius:3px;background:#ffffff26;overflow:hidden}
#flowbar i{display:block;height:100%;width:0;background:#7be495}
#flowtxt{font-size:13px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;background:#f33;opacity:0;pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="timer">0.00</div>
<div id="best"></div>
<div id="prog"></div>
<div id="flow"><div id="flowbar"><i></i></div><div id="flowtxt"></div></div>
<div id="toast"></div>
<div id="speed">0 <small>u/s</small></div>
<button class="btn" id="gear">⚙</button>
<button class="btn" id="restart">↺</button>

  <label>Level</label>

  <input id="sens" type="range" min="4" max="30" step="1">

  <div class="row" id="cam"><button data-c="3">third<br>person</button><button data-c="1">first<br>person</button></div>

  <input id="gspeed" type="range" min="100" max="115" step="1">
  <label>Speed effects <span id="fxv"></span></label>
  <input id="fx" type="range" min="0" max="150" step="5">
  <label>Music <span id="musv"></span></label>
  <input id="mus" type="range" min="0" max="100" step="5">
  <label>Sound effects <span id="sfxv"></span></label>
  <input id="sfx" type="range" min="0" max="100" step="5">
</div>
<div id="msg"></div>
<div id="flash"></div>

// ---------- Loop ----------

  } else { acc = 0; prevPos.copy(pos); }

  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const k = 1 - Math.exp(-dt * 14);

  const shake = Math.max(0, (speed - 1800) / 1700) * 5; // faint buzz at high speed

    folPos.set(rp.x + (Math.random() - 0.5) * shake, rp.y + FP_EYE + (Math.random() - 0.5) * shake, rp.z);
    folLook.set(rp.x + fx * 600, rp.y + FP_EYE - 100, rp.z + fz * 600);
  } else {
  lagT.set(-vel.x, -vel.y * 0.5, -vel.z).multiplyScalar(0.05 * fxAmt * Math.min(1, speed / 700));
  if (lagT.length() > 170 * fxAmt) lagT.setLength(170 * fxAmt);

  folPos.set(rp.x + camOff.x + camLag.x + (Math.random() - 0.5) * shake, rp.y + camOff.y + camLag.y + (Math.random() - 0.5) * shake, rp.z + camOff.z + camLag.z);

  updateFlow(dt); drawFlow(); updateNpcs(now); updateTrail(speed); updateDrops(speed); updateStreaks(speed); tickTheme(dt); updateSky(dt, now); updateRings(dt, now); Music.setSpeed(speed + (flow.on ? 700 : 0));
  const hue = Math.max(0, Math.min(1, (speed - 500) / 2500));

  speedEl.innerHTML = Math.round(speed) + ' <small>u/s</small>';

applyScenery(themesOn);
Music.setVolume(musicVol); Music.setSfxVolume(sfxVol);
if (stageMeta.music && !/^#edit/.test(location.hash)) { // one trigger event per checkpoint / portal, ordered by piece, so a respawn can find the section in force

resetRun();
startIntro();

if (LEVEL === 'custom') { try { const f = JSON.parse(store.get('surf_custom_from') || 'null'); if (f) { store.set('surf_custom_from', ''); startFrom(f); } } catch (e) {} }
if (/^#edit/.test(location.hash)) { const sc = document.createElement('script'); sc.src = 'editor.js?v=' + Date.now(); document.body.appendChild(sc); } // desktop level editor
requestAnimationFrame(frame);
</script>
