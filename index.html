<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snail Surf">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<title>Surf Prototype</title>
<style>
html,body{-webkit-tap-highlight-color:transparent;margin:0;height:100%;overflow:hidden;background:#0b0f1a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#speed{position:fixed;left:16px;bottom:12px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000a;pointer-events:none}
#speed small{font-size:13px;opacity:.7;font-weight:500}
#timer{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000a;pointer-events:none}
#best,#prog{position:fixed;left:12px;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 4px #000a}
#best{top:12px}#prog{top:30px}
.btn{position:fixed;top:8px;width:40px;height:40px;border-radius:20px;border:0;background:#ffffff22;color:#fff;font-size:20px;backdrop-filter:blur(6px)}
#restart{right:8px}#gear{right:56px}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:17px;line-height:1.4;background:#000a;padding:14px 18px;border-radius:12px;max-width:80vw;pointer-events:none}
#msg b{font-size:22px}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);font-size:15px;font-weight:600;color:#ffe066;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 4px #000a}
#settings{position:fixed;right:8px;top:56px;background:#000c;padding:12px;border-radius:12px;font-size:14px;width:220px;max-height:calc(100vh - 70px);overflow-y:auto;overscroll-behavior:contain}
#settings summary{cursor:pointer;margin:10px 0 2px;color:#9fb0c8;font-size:13px}
#settings label{display:block;margin:6px 0 4px}
#settings .row{display:flex;gap:6px}
#settings .row button{flex:1;padding:8px 0;border:0;border-radius:8px;background:#ffffff22;color:#fff;font-size:13px}
#settings .row button.on{background:#3fc1c9;color:#000}
#settings #lvl{flex-wrap:wrap}#settings #lvl button{flex:1 1 30%;padding:6px 2px;font-size:12px}
#settings input{width:100%}
#flow{position:fixed;left:50%;top:38px;transform:translateX(-50%);width:210px;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 1px 4px #000a}
#flow.on{opacity:1}
#flowbar{height:6px;border-radius:3px;background:#ffffff26;overflow:hidden}
#flowbar i{display:block;height:100%;width:0;background:#7be495}
#flowtxt{font-size:13px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
#rkt{position:fixed;left:16px;bottom:58px;width:92px;height:8px;border-radius:4px;background:#ffffff22;overflow:hidden;pointer-events:none;opacity:.85}
#rkt i{position:absolute;left:0;right:0;top:0;bottom:0;background:#7be495;transform-origin:left}
#rkt span{display:none}
#build{position:fixed;left:12px;top:48px;font-size:11px;opacity:.6;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000a}
#flash{position:fixed;inset:0;background:#f33;opacity:0;pointer-events:none;transition:opacity .3s}
</style>
</head>

<div id="prog"></div>

  <input id="sfx" type="range" min="0" max="100" step="5">

  <input id="fovo" type="range" min="-15" max="25" step="1">

  <input id="sens" type="range" min="4" max="30" step="1">

  </details>
</div>
